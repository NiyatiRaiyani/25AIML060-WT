<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive UI | Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container nav-container">
        <h1 class="logo">EduConnect</h1>

        <nav class="navbar" aria-label="Main Navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="registration.html" class="active">Registration</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="events.html">Events</a>
        </nav>
    </div>
</header>

<main>

    <section class="page-banner">
        <div class="container">
            <span class="section-label">Registration</span>
            <h2>Create Your Account</h2>
            <p>Complete the form below to register.</p>
        </div>
    </section>

    <section class="section">
        <div class="container form-container">

            <form class="registration-form">

                <div class="form-row">

                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="Enter first name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Enter last name"
                            required
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter mobile number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Select Course</label>
                    <select id="course" name="course" required>
                        <option value="">Select a course</option>
                        <option value="aiml">Artificial Intelligence & Machine Learning</option>
                        <option value="computer">Computer Engineering</option>
                        <option value="it">Information Technology</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Additional Information</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="4"
                        placeholder="Enter additional information"
                    ></textarea>
                </div>

                <button type="submit" class="btn primary-btn">
                    Submit Registration
                </button>

            </form>

        </div>
    </section>

</main>

<footer class="footer">
    <p>&copy; 2026 EduConnect. All Rights Reserved.</p>
</footer>

</body>
</html>
